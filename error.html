<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Stackly</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/error.css">
</head>

<body>

    <!-- Error Container -->
    <div class="error-container">

        <!-- Error Card -->
        <div class="error-card">

            <!-- Logo -->
            <div class="logo-wrapper">
                <a href="index.html">
                    <img src="image/logo-stackly.png" alt="Stackly Logo">
                </a>
            </div>

            <!-- Error Number -->
            <div class="error-number">404</div>

            <!-- Error Icon -->
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>

            <!-- Error Message -->
            <h1>Oops! Page Not Found</h1>

            <p class="error-description">
                The page you're looking for doesn't exist or has been moved.
                Don't worry, you can go back or visit our homepage.
            </p>

            <!-- Action Buttons -->
            <div class="error-buttons">
                <button onclick="goBack()" class="btn-back">
                    <i class="fas fa-arrow-left"></i>
                    Back to Previous Page
                </button>

                <a href="index.html" class="btn-home">
                    <i class="fas fa-home"></i>
                    Go to Homepage
                </a>
            </div>

            <!-- Quick Links -->
            <div class="quick-links">
                <span>Quick Links:</span>
                <a href="about.html">About</a>
                <a href="projects.html">Projects</a>
                <a href="contact.html">Contact</a>
            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script>
        // Go back to previous page
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }

        // Optional: Add keyboard shortcut (ESC to go back)
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                goBack();
            }
        });
    </script>

</body>

</html>
